# HTTPS admin on a separate port: the existing site keeps ports 80/443.
# This IP certificate is renewed by limilink-cert-renew.timer, which reloads nginx.
server {
    listen 8443 ssl http2;
    server_name 64.188.118.144;

    root /srv/felmee-admin/current;
    index index.html;

    ssl_certificate /srv/limilink/tls/live/64.188.118.144/fullchain.pem;
    ssl_certificate_key /srv/limilink/tls/live/64.188.118.144/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/felmee-admin.access.log;
    error_log /var/log/nginx/felmee-admin.error.log;
    client_max_body_size 50m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    # Re-resolve the production backend without waiting for an nginx reload.
    resolver 127.0.0.53 valid=300s ipv6=off;
    set $felmee_backend https://felmee.com;
    proxy_ssl_server_name on;
    proxy_ssl_name felmee.com;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify_depth 3;

    location ^~ /api/ {
        proxy_pass $felmee_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host felmee.com;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 90s;
    }

    location = /ws {
        proxy_pass $felmee_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host felmee.com;
        # The upstream accepts this Origin; JWT is still checked in STOMP CONNECT.
        proxy_set_header Origin https://felmee.com;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
    }
}
